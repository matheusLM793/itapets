<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - ItaPets</title>
    <link rel="stylesheet" type="text/css" href="css/style.css">
  </head>

  <body>
    <header>
      <h1>ItaPets</h1>
      <nav>
        <ul>
          <li><a href="index.html">Produtos</a></li>
          <li><a href="contato.html">Contato</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h2>Fale Conosco</h2>

      <form action="https://formsubmit.co/matheussantosjesus126@gmail.com" method="post">
        <label for="name">Nome:</label><br>
        <input type="text" id="name" name="name"><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email"><br><br>

        <label for="number">Telefone:</label><br>
        <input type="tel" id="number" name="number"><br><br>

        Qual seu animal de estimação?<br>

        <input type="radio" id="cachorro" name="option" value="option1">
        <label for="cachorro">Cachorro</label><br>
        <input type="radio" id="gato" name="option" value="option2">
        <label for="gato">Gato</label><br>
        <input type="radio" id="os dois" name="option" value="option3">
        <label for="os dois">Os dois</label><br><br>

        <label for="message">Comentário:</label><br>
        <textarea id="message" name="message" rows="10" cols="30"></textarea>
        <br><br>

        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
      </form>
    </main>

    <footer>2026 ItaPets.</footer>
  </body>
</html>
