<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - ItaPets</title>
    <link rel="stylesheet" type="text/css" href="css/style.css">
  </head>

  <body>
    <header>
      <h1>ItaPets</h1>
      <nav>
        <ul>
          <li><a href="index.html">Produtos</a></li>
          <li><a href="contato.html">Contato</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <h2>Fale Conosco</h2>

      <form action="https://formsubmit.co/matheussantosjesus126@gmail.com" method="post">
        <label for="name">Nome:</label>
        <input type="text" id="name" name="name">

        <label for="email">Email:</label>
        <input type="email" id="email" name="email">

        <label for="number">Telefone:</label>
        <input type="tel" id="number" name="number">
        
        <fieldset>
          <legend>Qual seu animal de estimação?</legend>
          <input type="radio" id="cachorro" name="option" value="option1">
          <label for="cachorro">Cachorro</label>
          <input type="radio" id="gato" name="option" value="option2">
          <label for="gato">Gato</label>
          <input type="radio" id="os-dois" name="option" value="option3">
          <label for="os-dois">Os dois</label>
        </fieldset>

        <label for="message">Comentário:</label>
        <textarea id="message" name="message" rows="10" cols="30"></textarea>

        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
      </form>
    </main>

    <footer>2026 ItaPets.</footer>
  </body>
</html>
